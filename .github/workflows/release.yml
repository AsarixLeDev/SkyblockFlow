name: Release
on:
  push:
    tags: ['PUBLIC-*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify release version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "$version" = "$GITHUB_REF_NAME"
      - name: Build public release
        run: ./gradlew --no-daemon publicRelease
      - name: Create checksums
        working-directory: build/libs
        run: sha256sum *.jar > SHA256SUMS
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=()
          if [[ "$GITHUB_REF_NAME" == PUBLIC-BETA-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/skyblockflow-${GITHUB_REF_NAME}.jar" \
            "build/libs/skyblockflow-${GITHUB_REF_NAME}-sources.jar" \
            build/libs/SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md "${release_args[@]}"
